<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>COGSCI 200 Flashcards</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 680px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #94a3b8;
  }
  .counter {
    font-size: 13px;
    color: #64748b;
    font-variant-numeric: tabular-nums;
  }

  .filter-bar {
    padding: 10px 14px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-bar button {
    background: #1e293b;
    color: #94a3b8;
    border: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .filter-bar button.active {
    background: #3b82f6;
    color: white;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 0;
    perspective: 1400px;
  }

  .card-wrap {
    width: 100%;
    max-width: 560px;
    height: 100%;
    max-height: 560px;
    position: relative;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 28px 24px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.04) inset;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .card-face::-webkit-scrollbar { width: 4px; }
  .card-face::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  .front {
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .back {
    background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
    transform: rotateY(180deg);
  }

  .tag {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    align-self: flex-start;
  }
  .front .tag { align-self: center; }

  .term {
    font-size: 28px;
    font-weight: 700;
    color: white;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .term-cn {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    margin-top: 6px;
  }
  .hint {
    margin-top: 28px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
  }

  .back-content {
    color: rgba(255,255,255,0.92);
    font-size: 15px;
    line-height: 1.65;
    flex: 1;
  }
  .back-content p { margin: 0 0 12px 0; }
  .back-content strong {
    color: #fbbf24;
    font-weight: 600;
  }
  .back-content em {
    color: #93c5fd;
    font-style: normal;
    font-weight: 500;
  }
  .back-content .en {
    color: rgba(255,255,255,0.6);
    font-size: 13.5px;
    font-style: italic;
  }
  .back-content .en-side { margin: 0 0 12px 0; }
  .back-content .en-side p:last-child { margin-bottom: 0; }
  .back-content .cn-side {
    border-top: 1px solid rgba(255,255,255,0.14);
    padding-top: 14px;
    margin-top: 14px;
    color: rgba(255,255,255,0.72);
    font-size: 14px;
    line-height: 1.6;
  }
  .back-content .cn-side strong { color: #fcd34d; }
  .back-content .cn-side em { color: #a5b4fc; font-style: normal; font-weight: 500; }
  .back-content .cn-side ul { padding-left: 20px; }
  .back-content .cn-side p:last-child { margin-bottom: 0; }
  .back-content code {
    background: rgba(0,0,0,0.3);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
  }
  .back-content .formula {
    display: block;
    background: rgba(0,0,0,0.3);
    padding: 12px;
    border-radius: 8px;
    margin: 10px 0;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 13px;
    text-align: center;
    color: #fde68a;
    overflow-x: auto;
  }
  .back-content ul {
    margin: 6px 0 12px 0;
    padding-left: 22px;
  }
  .back-content li { margin-bottom: 4px; }

  footer {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid #1e293b;
    flex-shrink: 0;
  }
  footer button {
    flex: 1;
    background: #1e293b;
    color: #e2e8f0;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  footer button:active { transform: scale(0.97); background: #334155; }
  footer button.primary {
    background: #3b82f6;
  }
  footer button.primary:active { background: #2563eb; }
  footer button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .progress-bar {
    height: 3px;
    background: #1e293b;
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    background: #3b82f6;
    transition: width 0.3s;
  }

  .mark-buttons {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 16px;
  }
  .mark-buttons button {
    flex: 1;
    padding: 10px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .mark-buttons button.known { background: rgba(34,197,94,0.18); color: #86efac; }
  .mark-buttons button.review { background: rgba(239,68,68,0.18); color: #fca5a5; }

  .empty {
    color: #64748b;
    text-align: center;
    padding: 40px 20px;
  }

  @media (max-width: 400px) {
    .term { font-size: 24px; }
    .card-face { padding: 22px 18px; }
    header { padding: 12px 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>COGSCI 200 · Flashcards</h1>
    <div class="counter" id="counter">0 / 0</div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="filter-bar" id="filters"></div>

  <main>
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-face front">
          <span class="tag" id="frontTag">—</span>
          <div class="term" id="term">Loading…</div>
          <div class="term-cn" id="termCn"></div>
          <div class="hint">点一下看答案 · tap to flip</div>
        </div>
        <div class="card-face back">
          <span class="tag" id="backTag">—</span>
          <div class="back-content" id="backContent"></div>
          <div class="mark-buttons">
            <button class="review" onclick="event.stopPropagation(); mark('review')">🔁 再看 Review</button>
            <button class="known" onclick="event.stopPropagation(); mark('known')">✓ 会了 Got it</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <button id="prevBtn" onclick="prev()">← 上一张</button>
    <button class="primary" onclick="flip()">翻转 Flip</button>
    <button id="nextBtn" onclick="next()">下一张 →</button>
  </footer>
</div>

<script src="cards.js"></script>
<script>
// Card data loaded from cards.js


// === App Logic ===
const topics = ["All", ...new Set(CARDS.map(c => c.topic))];
const state = {
  filter: "All",
  order: [],
  index: 0,
  flipped: false,
  known: new Set(JSON.parse(localStorage.getItem("known") || "[]"))
};

function renderFilters() {
  const bar = document.getElementById("filters");
  bar.innerHTML = "";
  topics.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = t;
    if (t === state.filter) btn.classList.add("active");
    btn.onclick = () => {
      state.filter = t;
      rebuildOrder();
      state.index = 0;
      state.flipped = false;
      renderFilters();
      render();
    };
    bar.appendChild(btn);
  });
}

function rebuildOrder() {
  const pool = state.filter === "All" ? CARDS : CARDS.filter(c => c.topic === state.filter);
  state.order = pool.map((_, i) => CARDS.indexOf(state.filter === "All" ? CARDS[i] : pool[i]));
  // Simpler: just find indices
  state.order = [];
  CARDS.forEach((c, i) => {
    if (state.filter === "All" || c.topic === state.filter) {
      state.order.push(i);
    }
  });
}

function render() {
  const total = state.order.length;
  if (total === 0) {
    document.getElementById("term").textContent = "没有卡片";
    document.getElementById("termCn").textContent = "";
    document.getElementById("backContent").innerHTML = "";
    document.getElementById("counter").textContent = "0 / 0";
    document.getElementById("progress").style.width = "0%";
    return;
  }
  const idx = state.order[state.index];
  const card = CARDS[idx];
  const cardEl = document.getElementById("card");

  if (state.flipped) cardEl.classList.add("flipped");
  else cardEl.classList.remove("flipped");

  document.getElementById("frontTag").textContent = card.topic;
  document.getElementById("backTag").textContent = card.topic;
  document.getElementById("term").textContent = card.term;
  document.getElementById("termCn").textContent = card.termCn || "";
  document.getElementById("backContent").innerHTML = card.back;

  document.getElementById("counter").textContent = `${state.index + 1} / ${total}`;
  document.getElementById("progress").style.width = `${((state.index + 1) / total) * 100}%`;

  document.getElementById("prevBtn").disabled = state.index === 0;
  document.getElementById("nextBtn").disabled = state.index === total - 1;
}

function flip() {
  state.flipped = !state.flipped;
  render();
}

function next() {
  if (state.index < state.order.length - 1) {
    state.index++;
    state.flipped = false;
    render();
  }
}

function prev() {
  if (state.index > 0) {
    state.index--;
    state.flipped = false;
    render();
  }
}

function mark(kind) {
  const idx = state.order[state.index];
  if (kind === "known") state.known.add(idx);
  else state.known.delete(idx);
  localStorage.setItem("known", JSON.stringify([...state.known]));
  next();
}

// Card click to flip
document.getElementById("card").addEventListener("click", flip);

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight" || e.key === "j") next();
  else if (e.key === "ArrowLeft" || e.key === "k") prev();
  else if (e.key === "1") mark("review");
  else if (e.key === "2") mark("known");
});

// Swipe gestures
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) {
    if (dx < 0) next();
    else prev();
  }
  touchX = null;
});

// Init
rebuildOrder();
renderFilters();
render();
</script>
</body>
</html>
