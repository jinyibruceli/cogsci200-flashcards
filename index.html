<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>COGSCI 200 Flashcards</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 680px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #94a3b8;
  }
  .counter {
    font-size: 13px;
    color: #64748b;
    font-variant-numeric: tabular-nums;
  }

  .filter-bar {
    padding: 10px 14px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-bar button {
    background: #1e293b;
    color: #94a3b8;
    border: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .filter-bar button.active {
    background: #3b82f6;
    color: white;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 0;
    perspective: 1400px;
  }

  .card-wrap {
    width: 100%;
    max-width: 560px;
    height: 100%;
    max-height: 560px;
    position: relative;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 28px 24px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.04) inset;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .card-face::-webkit-scrollbar { width: 4px; }
  .card-face::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  .front {
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .back {
    background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
    transform: rotateY(180deg);
  }

  .tag {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    align-self: flex-start;
  }
  .front .tag { align-self: center; }

  .term {
    font-size: 28px;
    font-weight: 700;
    color: white;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .term-cn {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    margin-top: 6px;
  }
  .hint {
    margin-top: 28px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
  }

  .back-content {
    color: rgba(255,255,255,0.92);
    font-size: 15px;
    line-height: 1.65;
    flex: 1;
  }
  .back-content p { margin: 0 0 12px 0; }
  .back-content strong {
    color: #fbbf24;
    font-weight: 600;
  }
  .back-content em {
    color: #93c5fd;
    font-style: normal;
    font-weight: 500;
  }
  .back-content .en {
    color: rgba(255,255,255,0.6);
    font-size: 13.5px;
    font-style: italic;
  }
  .back-content code {
    background: rgba(0,0,0,0.3);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
  }
  .back-content .formula {
    display: block;
    background: rgba(0,0,0,0.3);
    padding: 12px;
    border-radius: 8px;
    margin: 10px 0;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 13px;
    text-align: center;
    color: #fde68a;
    overflow-x: auto;
  }
  .back-content ul {
    margin: 6px 0 12px 0;
    padding-left: 22px;
  }
  .back-content li { margin-bottom: 4px; }

  footer {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid #1e293b;
    flex-shrink: 0;
  }
  footer button {
    flex: 1;
    background: #1e293b;
    color: #e2e8f0;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  footer button:active { transform: scale(0.97); background: #334155; }
  footer button.primary {
    background: #3b82f6;
  }
  footer button.primary:active { background: #2563eb; }
  footer button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .progress-bar {
    height: 3px;
    background: #1e293b;
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    background: #3b82f6;
    transition: width 0.3s;
  }

  .mark-buttons {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 16px;
  }
  .mark-buttons button {
    flex: 1;
    padding: 10px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .mark-buttons button.known { background: rgba(34,197,94,0.18); color: #86efac; }
  .mark-buttons button.review { background: rgba(239,68,68,0.18); color: #fca5a5; }

  .empty {
    color: #64748b;
    text-align: center;
    padding: 40px 20px;
  }

  @media (max-width: 400px) {
    .term { font-size: 24px; }
    .card-face { padding: 22px 18px; }
    header { padding: 12px 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>COGSCI 200 · Flashcards</h1>
    <div class="counter" id="counter">0 / 0</div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="filter-bar" id="filters"></div>

  <main>
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-face front">
          <span class="tag" id="frontTag">—</span>
          <div class="term" id="term">Loading…</div>
          <div class="term-cn" id="termCn"></div>
          <div class="hint">点一下看答案 · tap to flip</div>
        </div>
        <div class="card-face back">
          <span class="tag" id="backTag">—</span>
          <div class="back-content" id="backContent"></div>
          <div class="mark-buttons">
            <button class="review" onclick="event.stopPropagation(); mark('review')">🔁 再看 Review</button>
            <button class="known" onclick="event.stopPropagation(); mark('known')">✓ 会了 Got it</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <button id="prevBtn" onclick="prev()">← 上一张</button>
    <button class="primary" onclick="flip()">翻转 Flip</button>
    <button id="nextBtn" onclick="next()">下一张 →</button>
  </footer>
</div>

<script>
const CARDS = [
  // === Marr's levels & Cross-cutting ===
  {
    topic: "Cross-cutting",
    term: "Marr's three levels of explanation",
    termCn: "Marr 的三层解释",
    back: "研究任何心智能力都拆成三层：<br><br><strong>Functional（功能层）</strong>：<em>这个能力要解决什么问题？</em><br>例：看东西 = 从 2D 视网膜图猜 3D 世界。<br><br><strong>Algorithmic（算法层）</strong>：<em>用什么步骤/方法？</em><br>例：Bayesian inference、phrase-structure grammar、Q-learning。<br><br><strong>Physical（物理层）</strong>：<em>在哪个神经结构实现？</em><br>例：Broca / Wernicke / FFA / vmPFC / VTA。<br><br><span class='en'>Every topic gets analyzed at all three levels. Exam will definitely test this.</span>"
  },
  {
    topic: "Cross-cutting",
    term: "Input-Output Equivalence",
    termCn: "输入-输出等价",
    back: "同一个 <strong>function</strong> 可以由 <strong>多个不同算法</strong> 实现。<br><br>变的是 <em>function → algorithm</em> 这一层。<br><br>例子：<ul><li>找回文有多种算法（两端往中间、中间往两端）</li><li>Turing Test ——只比较输入输出，不管内部怎么算</li></ul><span class='en'>Same function, different algorithms.</span>"
  },
  {
    topic: "Cross-cutting",
    term: "Multiple Realizability",
    termCn: "多重可实现",
    back: "同一个 <strong>algorithm</strong> 可以在 <strong>多个不同物理基底</strong> 上实现。<br><br>变的是 <em>algorithm → physical</em> 这一层。<br><br>例子：<ul><li>Candy Crush 在 Mac / iPhone / Android 上都能跑</li><li>某个回文算法在图灵机或 PC 上都能跑</li><li>Bayesian 算法在人脑或外星人脑里都可以</li></ul><span class='en'>Same algorithm, different physical substrates.</span>"
  },
  {
    topic: "Cross-cutting",
    term: "Dual Processes",
    termCn: "双过程",
    back: "心智有<strong>快</strong>（自动/感性/无意识）和<strong>慢</strong>（刻意/理性/有意识）两套系统。<br><br>不同主题里的版本：<ul><li>Kahneman 的 <strong>System 1 / System 2</strong></li><li>LeDoux 的 <strong>Low Road / High Road</strong>（恐惧）</li><li>Cosmides & Tooby 的 <strong>Cheater Detection Module</strong> vs central cognition</li><li><strong>Blindsight</strong>：皮层下（无意识）vs 皮层（有意识）视觉</li><li>Greene 的道德判断：personal alarm-bell vs impersonal cost-benefit</li></ul><span class='en'>Fast/automatic vs slow/deliberate. Appears in every major topic.</span>"
  },
  {
    topic: "Cross-cutting",
    term: "Poverty of the Stimulus",
    termCn: "刺激贫乏论证",
    back: "<strong>输入贫乏、输出丰富</strong> → 必须有先天结构填补。<br><br>经典领域：<ul><li><strong>Language</strong>：儿童输入有限却掌握复杂语法 → <em>Universal Grammar</em>（Chomsky）</li><li><strong>Moral</strong>：儿童从贫乏道德输入发展出精致判断 → <em>Universal Moral Grammar</em>（Mikhail）</li><li><strong>Perception</strong>：视觉系统用 hidden assumptions 作为先验</li><li><strong>Infant cognition</strong>：婴儿短期内学到海量知识</li></ul><span class='en'>The gap between meager input and rich output requires innate structure.</span>"
  },
  {
    topic: "Cross-cutting",
    term: "Tacit Knowledge",
    termCn: "隐性知识",
    back: "系统里有、但人<strong>说不出来</strong>的知识——你在用，但解释不清。<br><br>例子：<ul><li>语言的 <em>interrogative rule</em>（"move main verb"，你用对了但说不出）</li><li>视觉的 <em>5 条 hidden assumptions</em></li><li>婴儿的 <em>直觉物理</em>（continuity、solidity 等）</li><li>道德的 <em>Doctrine of Double Effect</em></li></ul><span class='en'>Information within a system that the person cannot readily articulate.</span>"
  },
  {
    topic: "Cross-cutting",
    term: "Universality",
    termCn: "普遍性",
    back: "支持先天性的一大论证——某能力在<strong>所有人类文化</strong>中都出现。<br><br>例子：<ul><li><strong>Language universality</strong>：所有社会都有语言，没有"石器时代语言"</li><li><strong>Nicaraguan Sign Language</strong>（Senghas 2004）——儿童自发创造语言</li><li><strong>Ekman's basic emotions</strong>——6 种基本情绪跨文化识别</li></ul><span class='en'>Present in all human societies with same complexity everywhere.</span>"
  },

  // === Modularity ===
  {
    topic: "Modularity",
    term: "Modularity (6 characteristic features)",
    termCn: "模块性的 6 个典型特征",
    back: "Fodor 提出的 <strong>characteristic</strong> 特征（<em>注意：没有一条是 required！</em>）：<br><ul><li><strong>Mandatory</strong>（强制）— 不受意识控制就启动</li><li><strong>Fast</strong>（快）— 250-350ms 处理一个词</li><li><strong>Domain-specific</strong>（领域特定）— 只处理有限输入</li><li><strong>Informationally encapsulated</strong>（信息封装）— 模块拿不到其他系统信息</li><li><strong>Inaccessible</strong>（不可访问）— 其他系统拿不到模块内信息</li><li><strong>Neurally discretely localized</strong>（神经定位）— 有特定脑区</li></ul><span class='en'>Exam 2 考过："Which is required?" 答：<strong>None of the above!</strong></span>"
  },
  {
    topic: "Modularity",
    term: "Informational Encapsulation vs Inaccessibility",
    termCn: "信息封装 vs 不可访问",
    back: "方向相反，容易混：<br><br><strong>Informational Encapsulation</strong>：<em>模块 → 外</em> 看不到<br>Müller-Lyer 错觉——你明知两线等长，视觉模块拿不到这个知识，还是看到不等长。<br>飞行恐惧——明知飞机安全，恐惧模块不听。<br><br><strong>Inaccessibility</strong>：<em>外 → 模块</em> 看不到<br>Xin 会用 interrogative rule 但说不出规则内容。<br>Moral grammar 的 hidden rules 你说不出。<br><br><span class='en'>Encapsulation: module can't see outside. Inaccessibility: outside can't see into module.</span>"
  },

  // === Perception ===
  {
    topic: "Perception",
    term: "Inverse Optics Problem",
    termCn: "逆光学问题",
    back: "感知的根本难题：<strong>从 2D 视网膜图像推断外界 3D 场景</strong>。<br><br>这是 <strong>underdetermined</strong>（欠定）问题——无数不同 3D 场景可以投射出完全相同的 2D 图像。<br><br>例：一排不同距离的正方形 vs 一排歪菱形在不同距离，可以在视网膜上留下完全一样的图案。<br><br>解决靠 <em>hidden assumptions（hidden priors）</em> + Bayes' Rule。<br><br><span class='en'>The brain uses hidden assumptions as Bayesian priors.</span>"
  },
  {
    topic: "Perception",
    term: "5 Hidden Assumptions of Perception",
    termCn: "感知系统的 5 条隐藏假设",
    back: "<ol><li>光来自<strong>单一顶部光源</strong>（single overhead light source）</li><li>阴影下物体<strong>比传感器显示的更亮</strong></li><li>东西倾向<strong>直线运动</strong></li><li>运动物上所有点<strong>同步运动</strong></li><li>运动物会<strong>逐步遮盖/露出持续背景</strong></li></ol><br>这 5 条都是 <strong>innate</strong>（Hershberger 小鸡实验证明"光从上"是先天的）。<br><br><span class='en'>These are Bayesian priors—innate structural constraints.</span>"
  },
  {
    topic: "Perception",
    term: "Bayes' Rule",
    termCn: "贝叶斯规则",
    back: "<span class='formula'>P(h|d) = P(d|h) · P(h) / Σⱼ P(d|hⱼ) · P(hⱼ)</span><strong>P(h|d)</strong> = <em>Posterior</em>（后验，看到数据后对假设的信念）<br><strong>P(d|h)</strong> = <em>Likelihood</em>（似然）<br><strong>P(h)</strong> = <em>Prior</em>（先验）<br><strong>分母</strong> = <em>Normalizing term</em>（归一化项 / 总证据）<br><br>用于感知：<span class='formula'>P(scene|retinal) = P(retinal|scene)·P(scene) / P(retinal)</span>P(scene) = hidden assumptions！"
  },
  {
    topic: "Perception",
    term: "Hershberger (1970) chicks",
    termCn: "Hershberger 小鸡实验",
    back: "证明 <em>"光从上方来"假设是 <strong>innate</strong></em>。<br><br>方法：小鸡从孵化起就在<strong>光从下方来</strong>的笼子里——连孵蛋都用下方灯。<br><br>训练啄<em>凹坑</em> 或 <em>凸起</em>，然后测试两张图：<br><ul><li>B 图：阴影在上（假设光从上 → 看起来像 dent）</li><li>C 图：阴影在下（假设光从上 → 看起来像 bump）</li></ul>结果：训练啄 <strong>dents</strong> 的啄 <strong>B</strong>；训练啄 <strong>bumps</strong> 的啄 <strong>C</strong>。<br><br>结论：尽管从未经历过光从上，它们依然默认这个假设 → <strong>innate</strong>。"
  },
  {
    topic: "Perception",
    term: "Sugita (2008) face-deprived monkeys",
    termCn: "Sugita 猴子面孔剥夺实验",
    back: "证明 <strong>先天面孔模板 + 经验微调</strong>。<br><br>方法：日本猕猴从出生起被剥夺面孔暴露（饲养员戴面具）6/12/24 月，然后暴露人脸或猴脸 1 月。<br><br>结果：<ul><li><strong>剥夺期结束前</strong>：已经偏好面孔胜过物体（<em>天生的面孔检测模板</em>！），但不区分人脸/猴脸</li><li><strong>暴露人脸 1 月后</strong>：偏好人脸</li><li><strong>暴露猴脸 1 月后</strong>：像控制组，偏好猴脸</li></ul><br>展示 <strong>innate structure + environmental input + sensitive period</strong>。"
  },
  {
    topic: "Perception",
    term: "Blindsight",
    termCn: "盲视",
    back: "<strong>V1（初级视觉皮层）</strong>受损的患者——主观"看不见"受损视野里的东西，<strong>但能避开障碍物、接住抛物</strong>。<br><br>视觉信号走皮层下通路：<em>retina → LGN → pulvinar / superior colliculus → 其他皮层</em>，绕开 V1，所以不上意识但能指导动作。<br><br>证据：视觉处理有 <strong>dual processes</strong>——有意识皮层通路 + 无意识皮层下通路。<br><br><span class='en'>Damage in primary visual cortex (V1) in the occipital lobe.</span>"
  },
  {
    topic: "Perception",
    term: "Prosopagnosia",
    termCn: "面孔失认症",
    back: "<strong>Fusiform Face Area (FFA)</strong> 损伤 → 无法识别面孔。<br><br>位置：<em>inferior (ventral) temporal lobe</em> 颞叶下/腹侧。<br><br>特点：<ul><li><strong>Selective deficit</strong>：只影响面孔，其他视觉正常</li><li>不是记忆问题</li></ul><span class='en'>Face blindness—selective deficit in face processing despite intact vision.</span>"
  },

  // === Infant Cognition ===
  {
    topic: "Infant",
    term: "Violation of Expectation method",
    termCn: "违反预期方法",
    back: "婴儿研究的经典方法。<br><br>原理：给婴儿看两种事件（符合预期 vs 违反预期），测<strong>注视时长</strong>。<br><br>如果婴儿对 <em>violation</em> 看得更久 → 说明她：<ol><li>有预期</li><li>检测到违反</li><li>用增加注意回应</li></ol>例：1+1 实验——屏幕后放玩具，揭示只剩 1 个（违反）vs 2 个（符合预期）。<br><br><span class='en'>Babies look longer at unexpected events.</span>"
  },
  {
    topic: "Infant",

// === App Logic ===
const topics = ["All", ...new Set(CARDS.map(c => c.topic))];
const state = {
  filter: "All",
  order: [],
  index: 0,
  flipped: false,
  known: new Set(JSON.parse(localStorage.getItem("known") || "[]"))
};

function renderFilters() {
  const bar = document.getElementById("filters");
  bar.innerHTML = "";
  topics.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = t;
    if (t === state.filter) btn.classList.add("active");
    btn.onclick = () => {
      state.filter = t;
      rebuildOrder();
      state.index = 0;
      state.flipped = false;
      renderFilters();
      render();
    };
    bar.appendChild(btn);
  });
}

function rebuildOrder() {
  const pool = state.filter === "All" ? CARDS : CARDS.filter(c => c.topic === state.filter);
  state.order = pool.map((_, i) => CARDS.indexOf(state.filter === "All" ? CARDS[i] : pool[i]));
  // Simpler: just find indices
  state.order = [];
  CARDS.forEach((c, i) => {
    if (state.filter === "All" || c.topic === state.filter) {
      state.order.push(i);
    }
  });
}

function render() {
  const total = state.order.length;
  if (total === 0) {
    document.getElementById("term").textContent = "没有卡片";
    document.getElementById("termCn").textContent = "";
    document.getElementById("backContent").innerHTML = "";
    document.getElementById("counter").textContent = "0 / 0";
    document.getElementById("progress").style.width = "0%";
    return;
  }
  const idx = state.order[state.index];
  const card = CARDS[idx];
  const cardEl = document.getElementById("card");

  if (state.flipped) cardEl.classList.add("flipped");
  else cardEl.classList.remove("flipped");

  document.getElementById("frontTag").textContent = card.topic;
  document.getElementById("backTag").textContent = card.topic;
  document.getElementById("term").textContent = card.term;
  document.getElementById("termCn").textContent = card.termCn || "";
  document.getElementById("backContent").innerHTML = card.back;

  document.getElementById("counter").textContent = `${state.index + 1} / ${total}`;
  document.getElementById("progress").style.width = `${((state.index + 1) / total) * 100}%`;

  document.getElementById("prevBtn").disabled = state.index === 0;
  document.getElementById("nextBtn").disabled = state.index === total - 1;
}

function flip() {
  state.flipped = !state.flipped;
  render();
}

function next() {
  if (state.index < state.order.length - 1) {
    state.index++;
    state.flipped = false;
    render();
  }
}

function prev() {
  if (state.index > 0) {
    state.index--;
    state.flipped = false;
    render();
  }
}

function mark(kind) {
  const idx = state.order[state.index];
  if (kind === "known") state.known.add(idx);
  else state.known.delete(idx);
  localStorage.setItem("known", JSON.stringify([...state.known]));
  next();
}

// Card click to flip
document.getElementById("card").addEventListener("click", flip);

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight" || e.key === "j") next();
  else if (e.key === "ArrowLeft" || e.key === "k") prev();
  else if (e.key === "1") mark("review");
  else if (e.key === "2") mark("known");
});

// Swipe gestures
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) {
    if (dx < 0) next();
    else prev();
  }
  touchX = null;
});

// Init
rebuildOrder();
renderFilters();
render();
</script>
